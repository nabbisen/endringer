[package]
name = "endringer"
version = "0.12.0"
edition = "2024"

description = "A lean library for VCS repository introspection."
authors = ["nabbisen"]
license = "Apache-2.0"

categories = ["development-tools", "filesystem"]
keywords = ["git", "jj", "vcs", "repository", "async"]
repository = "https://github.com/nabbisen/endringer"
readme = "README.md"
rust-version = "1.85.0"

[features]
default = []
# Enables AsyncRepository (requires a tokio runtime in the caller).
async = ["dep:tokio"]

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1

[profile.dev]
opt-level = 1
lto = false
incremental = true

[dependencies]
anyhow = "1"
gix = "0.77"
tokio = { version = "1", features = ["rt", "rt-multi-thread"], optional = true }
